global:
  # Design step: keep the global scrape interval conservative, then override
  # the app job to 10s because the internship tasks explicitly ask for that.
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: nexaplay-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - app:8000

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
